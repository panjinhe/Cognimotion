[project]
name = "cognimotion"
version = "0.1.0"
description = "语义驱动的动画引擎，将静态幻灯片转化为可编程的 SVG/Canvas 动画视频"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Cognimotion Team" }
]
keywords = ["animation", "svg", "canvas", "video", "automation", "ppt", "presentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

# 依赖将根据项目需要逐步添加
dependencies = []

[project.optional-dependencies]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
